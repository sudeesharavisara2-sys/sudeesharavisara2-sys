name: Daily README Refresh

on:
  schedule:
    # Daily at 3:30 PM Sri Lanka time
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-readme-refresh
  cancel-in-progress: false

jobs:
  refresh_readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh README timestamp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")
          timestamp = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M:%S UTC"
          )

          marker = f"<!-- DAILY_REFRESH: {timestamp} -->"
          pattern = r"<!-- DAILY_REFRESH: .*? -->"

          if re.search(pattern, content):
              content = re.sub(pattern, marker, content)
          else:
              content = content.rstrip() + "\n\n" + marker + "\n"

          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit and push
        run: |
          git config user.name "sudeesharavisara2-sys"
          git config user.email "sudeesharavisara2@gmail.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: daily README refresh"
          git push
